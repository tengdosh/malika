name: daily rebuild

# Keeps view counts current between posts. Analytics data changes every day; the
# site is static, so it needs a rebuild to pick the new numbers up.
#
# Why not Vercel Cron: Vercel cron jobs invoke a serverless function, which would
# mean adding an SSR adapter — and the build is deliberately adapter-free and
# portable. A deploy hook does the same job and works identically on Vercel and
# Cloudflare Pages.
#
# Setup: create a Deploy Hook in the host's dashboard and store the URL as the
# DEPLOY_HOOK_URL repository secret. If the secret is absent this job no-ops
# rather than failing, so a fresh clone does not show a red CI badge.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC — 08:17 in Tashkent, after the day rolls over
  workflow_dispatch: # lets Malika trigger a refresh by hand

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL is not set — skipping. See README > Deployment."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
          echo "Deploy triggered."
